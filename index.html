<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AvèlonStudios · Zentrale</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060606;font-family:'Jost',sans-serif;color:#e8e8e3;height:100vh;overflow:hidden;}
.dash{display:flex;height:100vh;overflow:hidden;}
.side{width:230px;flex-shrink:0;background:#080808;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;}
.side-brand{padding:22px 24px 18px;border-bottom:1px solid #1a1a1a;}
.side-logo{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:400;color:#c9b97a;line-height:1;letter-spacing:.02em;}
.side-sub{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#666;margin-top:5px;}
.side-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;font-size:14px;color:#999;}
.nav-item:hover{background:#101010;color:#ddd;}
.nav-item.active{background:#101010;border-left-color:#c9b97a;color:#f0ede6;}
.nav-ico{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.side-foot{padding:16px 24px;border-top:1px solid #1a1a1a;display:flex;align-items:center;gap:10px;}
.foot-av{width:32px;height:32px;border-radius:50%;background:#c9b97a22;border:1px solid #c9b97a44;display:flex;align-items:center;justify-content:center;font-size:12px;color:#c9b97a;font-weight:500;}
.foot-name{font-size:12px;color:#ddd;}
.foot-role{font-size:10px;color:#666;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:18px 30px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.top-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;color:#f0ede6;}
.top-git{display:flex;align-items:center;gap:8px;font-size:11px;padding:6px 13px;border-radius:20px;transition:all .3s;}
.top-git.online{color:#6a9a6a;background:#0f1a0f;border:1px solid #1d3a1d;}
.top-git.offline{color:#9a6a6a;background:#1a0f0f;border:1px solid #3a1d1d;}
.top-git.sync{color:#9a8a6a;background:#1a160f;border:1px solid #3a301d;}
.git-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.top-git.online .git-dot{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.content{flex:1;overflow-y:auto;padding:26px 30px;}
.btn{font-family:'Jost',sans-serif;font-size:12px;padding:8px 15px;border-radius:8px;border:1px solid #2a2a2a;background:#141414;color:#ddd;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:#c9b97a55;color:#fff;}
.btn-gold{background:#c9b97a;color:#1a1a1a;border-color:#c9b97a;font-weight:500;}
.btn-gold:hover{background:#d4c688;color:#1a1a1a;}
.greeting{margin-bottom:22px;}
.greeting h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:#f0ede6;line-height:1.1;}
.greeting p{font-size:13px;color:#888;margin-top:5px;}
.ov-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
.ov-col{display:flex;flex-direction:column;gap:18px;}
.card-box{background:#101010;border:1px solid #1c1c1c;border-radius:13px;padding:20px;}
.card-box .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-box .ch h3{font-size:13px;letter-spacing:.05em;color:#e8e8e3;font-weight:600;display:flex;align-items:center;gap:9px;}
.ch-ico{width:26px;height:26px;border-radius:7px;background:#c9b97a15;display:flex;align-items:center;justify-content:center;font-size:14px;color:#c9b97a;}
.ch-count{font-size:10px;color:#888;background:#1a1a1a;padding:3px 9px;border-radius:10px;}
.todo-add{display:flex;gap:8px;margin-bottom:14px;}
.todo-add input{flex:1;padding:9px 13px;background:#080808;border:1px solid #222;border-radius:8px;color:#e8e8e3;font-size:13px;font-family:'Jost',sans-serif;outline:none;}
.todo-add input:focus{border-color:#c9b97a55;}
.todo-add button{padding:9px 14px;background:#c9b97a;color:#1a1a1a;border:none;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;font-weight:500;}
.todo-list{display:flex;flex-direction:column;gap:2px;}
.todo{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:8px;transition:background .12s;}
.todo:hover{background:#0c0c0c;}
.todo-check{width:20px;height:20px;border-radius:6px;border:1.5px solid #333;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.todo-check:hover{border-color:#c9b97a;}
.todo-check.done{background:#c9b97a;border-color:#c9b97a;}
.todo-check.done svg{stroke:#1a1a1a;}
.todo-text{flex:1;font-size:13.5px;color:#ddd;transition:all .15s;}
.todo.done .todo-text{color:#555;text-decoration:line-through;}
.todo-del{width:22px;height:22px;border:none;background:none;color:#444;cursor:pointer;font-size:15px;opacity:0;transition:all .15s;border-radius:5px;flex-shrink:0;}
.todo:hover .todo-del{opacity:1;}
.todo-del:hover{background:#3a1a1a;color:#c97a7a;}
.todo-empty{text-align:center;padding:24px;color:#555;font-size:12.5px;}
.mini-board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.mini-col{text-align:center;padding:14px 6px;background:#0c0c0c;border:1px solid #1a1a1a;border-radius:9px;cursor:pointer;transition:all .15s;}
.mini-col:hover{border-color:#c9b97a44;transform:translateY(-2px);}
.mini-num{font-family:'Cormorant Garamond',serif;font-size:28px;color:#f0ede6;line-height:1;}
.mini-num.gold{color:#c9b97a;}
.mini-num.green{color:#7ac97a;}
.mini-num.red{color:#c97a7a;}
.mini-label{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:#777;margin-top:7px;}
.action{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #181818;}
.action:last-child{border-bottom:none;}
.action-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.action-body{flex:1;min-width:0;}
.action-name{font-size:13.5px;color:#e8e8e3;font-weight:500;}
.action-hint{font-size:11.5px;color:#888;margin-top:2px;}
.action-go{font-size:11px;color:#c9b97a;text-decoration:none;border:1px solid #c9b97a33;padding:4px 11px;border-radius:14px;white-space:nowrap;transition:all .15s;flex-shrink:0;cursor:pointer;}
.action-go:hover{background:#c9b97a1a;}
.action-empty{text-align:center;padding:20px;color:#555;font-size:12.5px;}
.goal-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.goal-now{font-family:'Cormorant Garamond',serif;font-size:34px;color:#c9b97a;line-height:1;}
.goal-target{font-size:12px;color:#888;}
.goal-bar{height:9px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.goal-fill{height:100%;background:linear-gradient(90deg,#c9b97a,#d4c688);border-radius:10px;transition:width .6s;}
.goal-meta{display:flex;justify-content:space-between;font-size:11px;color:#777;}
.umsatz-rows{margin-top:18px;}
.urow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #181818;font-size:13px;}
.urow:last-child{border-bottom:none;}
.urow-label{color:#aaa;}
.urow-val{font-weight:500;}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.statmini{background:#101010;border:1px solid #1c1c1c;border-radius:11px;padding:15px 16px;}
.statmini-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:8px;}
.statmini-num{font-family:'Cormorant Garamond',serif;font-size:30px;color:#f0ede6;line-height:1;}
.statmini-num.gold{color:#c9b97a;}
.statmini-sub{font-size:10.5px;color:#5cba5c;margin-top:5px;}
.section-h{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#888;margin:24px 0 14px;display:flex;align-items:center;gap:11px;}
.section-h::after{content:'';flex:1;height:1px;background:#1a1a1a;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.panel{background:#101010;border:1px solid #1c1c1c;border-radius:10px;padding:18px;}
.panel-h{font-size:13px;color:#ccc;margin-bottom:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
.panel-h span{font-size:10px;color:#666;}
.li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #181818;font-size:13px;}
.li:last-child{border-bottom:none;}
.li-name{color:#ccc;}
.li-meta{font-size:11px;color:#777;}
.pill{font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:.05em;}
.pill-gold{background:#c9b97a1a;color:#c9b97a;border:1px solid #c9b97a33;}
.pill-green{background:#1a3a1a;color:#7ac97a;border:1px solid #2a5a2a;}
.pill-blue{background:#1a2a3a;color:#7aaad0;border:1px solid #2a4a6a;}
.pill-grey{background:#1e1e1e;color:#999;border:1px solid #2a2a2a;}
.pill-red{background:#3a1a1a;color:#c97a7a;border:1px solid #5a2a2a;}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.board-desc{font-size:12px;color:#888;line-height:1.6;max-width:60%;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.col{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:13px;min-height:420px;transition:background .15s;}
.col.dragover{background:#13110c;border-color:#c9b97a44;}
.col-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#999;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;}
.col-count{background:#1a1a1a;color:#888;font-size:9px;padding:2px 7px;border-radius:10px;}
.card{background:#141414;border:1px solid #222;border-radius:8px;padding:11px;margin-bottom:9px;cursor:grab;transition:all .15s;position:relative;}
.card:hover{border-color:#c9b97a55;}
.card.dragging{opacity:.4;}
.card-name{font-size:12px;color:#e8e8e3;font-weight:500;margin-bottom:3px;padding-right:34px;}
.card-branch{font-size:10px;color:#888;margin-bottom:8px;}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.card-loc{font-size:9px;color:#666;}
.card-demo{font-size:9px;color:#c9b97a;text-decoration:none;border:1px solid #c9b97a33;padding:2px 7px;border-radius:10px;transition:all .15s;}
.card-demo:hover{background:#c9b97a1a;}
.card-acts{position:absolute;top:9px;right:9px;display:flex;gap:4px;opacity:0;transition:all .15s;}
.card:hover .card-acts{opacity:1;}
.card-act{width:16px;height:16px;border-radius:4px;background:#1e1e1e;color:#888;border:none;cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;}
.card-act:hover{background:#c9b97a22;color:#c9b97a;}
.card-act.del:hover{background:#3a1a1a;color:#c97a7a;}
.add-card{width:100%;padding:9px;background:transparent;border:1px dashed #2a2a2a;border-radius:8px;color:#666;font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;transition:all .15s;}
.add-card:hover{border-color:#c9b97a44;color:#c9b97a;}
.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.emp{background:#101010;border:1px solid #1c1c1c;border-radius:11px;padding:20px;cursor:pointer;transition:all .15s;}
.emp:hover{border-color:#c9b97a44;transform:translateY(-2px);}
.emp-top{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
.emp-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;flex-shrink:0;}
.emp-name{font-size:15px;color:#f0ede6;font-weight:500;}
.emp-role{font-size:11px;color:#888;}
.emp-skill{font-size:11px;color:#c9b97a;background:#c9b97a12;border:1px solid #c9b97a25;border-radius:7px;padding:8px 11px;margin-bottom:11px;}
.emp-desc{font-size:12px;color:#999;line-height:1.6;}
.emp-status{margin-top:12px;font-size:10px;color:#5cba5c;}
.auto-list{display:flex;flex-direction:column;gap:11px;}
.auto{background:#101010;border:1px solid #1c1c1c;border-radius:10px;padding:15px 18px;display:flex;align-items:center;gap:15px;}
.auto-ico{width:38px;height:38px;border-radius:9px;background:#c9b97a15;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;}
.auto-info{flex:1;}
.auto-name{font-size:13px;color:#ddd;margin-bottom:3px;}
.auto-flow{font-size:11px;color:#777;}
.toggle{width:38px;height:21px;border-radius:20px;background:#1a3a1a;position:relative;flex-shrink:0;border:1px solid #2a5a2a;cursor:pointer;}
.toggle::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#5cba5c;top:2px;right:2px;transition:all .2s;}
.toggle.off{background:#2a1a1a;border-color:#3a2a2a;}
.toggle.off::after{background:#888;left:2px;right:auto;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-bg.show{display:flex;}
.modal{background:#101010;border:1px solid #2a2a2a;border-radius:14px;padding:26px;width:380px;max-width:90vw;max-height:88vh;overflow-y:auto;}
.modal-h{font-family:'Cormorant Garamond',serif;font-size:22px;color:#f0ede6;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;background:#080808;border:1px solid #2a2a2a;border-radius:8px;color:#e8e8e3;font-size:13px;font-family:'Jost',sans-serif;outline:none;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#c9b97a66;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;}
/* DETAIL PANEL */
.detail-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:flex-end;z-index:90;}
.detail-bg.show{display:flex;}
.detail{width:420px;max-width:92vw;height:100%;background:#0c0c0c;border-left:1px solid #222;padding:0;overflow-y:auto;animation:slideIn .25s cubic-bezier(.2,.6,.2,1);}
@keyframes slideIn{from{transform:translateX(40px);opacity:.5;}to{transform:none;opacity:1;}}
.detail-head{padding:26px 28px 22px;border-bottom:1px solid #1a1a1a;position:relative;}
.detail-status{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:inline-block;padding:4px 11px;border-radius:14px;}
.detail-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:#f0ede6;line-height:1.1;margin-bottom:5px;}
.detail-branch{font-size:13px;color:#999;}
.detail-close{position:absolute;top:24px;right:24px;width:30px;height:30px;border-radius:8px;background:#1a1a1a;border:none;color:#999;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.detail-close:hover{background:#2a1a1a;color:#c97a7a;}
.detail-body{padding:24px 28px;}
.dfield{margin-bottom:20px;}
.dfield-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#777;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.dfield-val{font-size:14.5px;color:#e8e8e3;line-height:1.5;}
.dfield-val a{color:#c9b97a;text-decoration:none;}
.dfield-val a:hover{text-decoration:underline;}
.dfield-val.empty{color:#555;font-style:italic;font-size:13px;}
.detail-notes{background:#101010;border:1px solid #1c1c1c;border-radius:10px;padding:15px;font-size:13.5px;color:#bbb;line-height:1.65;white-space:pre-wrap;}
.detail-actions{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap;}
.detail-actions .btn{flex:1;min-width:120px;justify-content:center;}
.detail-map{display:block;margin-top:18px;text-align:center;background:#13110c;border:1px solid #c9b97a33;border-radius:9px;padding:12px;color:#c9b97a;font-size:13px;text-decoration:none;transition:all .15s;}
.detail-map:hover{background:#1a1610;}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#666;font-size:13px;gap:10px;}
.spinner{width:16px;height:16px;border:2px solid #2a2a2a;border-top-color:#c9b97a;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:1000px){.ov-grid{grid-template-columns:1fr;}.statline{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}.crew{grid-template-columns:1fr;}.row2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="dash">
  <div class="side">
    <div class="side-brand"><div class="side-logo">Avèlon</div><div class="side-sub">Zentrale</div></div>
    <div class="side-nav" id="nav">
      <div class="nav-item active" data-view="home"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>Übersicht</div>
      <div class="nav-item" data-view="akquise"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>Akquise-Board</div>
      <div class="nav-item" data-view="crew"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>KI-Mitarbeiter</div>
      <div class="nav-item" data-view="pipeline"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Kunden-Pipeline</div>
      <div class="nav-item" data-view="auto"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Automatisierungen</div>
    </div>
    <div class="side-foot"><div class="foot-av">CP</div><div><div class="foot-name">Can Papenheim</div><div class="foot-role">Founder</div></div></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="top-title" id="viewTitle">Übersicht</div>
      <div class="top-git sync" id="status"><span class="git-dot"></span> <span id="statusText">Verbinde…</span></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-h" id="modalTitle">Neuer Lead</div>
    <div class="field"><label>Firmenname</label><input id="mName" placeholder="z.B. Malermeister Krüger"/></div>

const nav=document.getElementById('nav');
const content=document.getElementById('content');
const viewTitle=document.getElementById('viewTitle');
const titles={home:'Übersicht',akquise:'Akquise-Board',crew:'KI-Mitarbeiter',pipeline:'Kunden-Pipeline',auto:'Automatisierungen'};
let currentView='home';
function show(view){
  currentView=view;
  content.innerHTML=views[view]();
  viewTitle.textContent=titles[view];
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
  if(view==='akquise')initDragDrop();
}
nav.addEventListener('click',e=>{const item=e.target.closest('.nav-item');if(item)show(item.dataset.view);});
async function addTodo(){
  const inp=document.getElementById('todoInput');const text=inp.value.trim();if(!text)return;
  inp.value='';setStatus('sync','Speichere…');
  const {data,error}=await sb.from('todos').insert({text,done:false}).select();
  if(error){setStatus('offline','Fehler');return;}
  todos.push(data[0]);setStatus('online','Live verbunden');show('home');
  setTimeout(()=>document.getElementById('todoInput')?.focus(),50);
}
async function toggleTodo(id){
  const t=todos.find(x=>x.id===id);if(!t)return;t.done=!t.done;show('home');
  setStatus('sync','Speichere…');
  const {error}=await sb.from('todos').update({done:t.done}).eq('id',id);
  setStatus(error?'offline':'online',error?'Fehler':'Live verbunden');
}
async function delTodo(id){
  todos=todos.filter(x=>x.id!==id);show('home');setStatus('sync','Lösche…');
  const {error}=await sb.from('todos').delete().eq('id',id);
  setStatus(error?'offline':'online',error?'Fehler':'Live verbunden');
}
function initDragDrop(){
  let dragged=null;
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragged=card;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');dragged=null;});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover');});
    col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('dragover');
      if(!dragged)return;
      const id=+dragged.dataset.id;const newStatus=col.dataset.col;
      const lead=leads.find(l=>l.id===id);
      if(lead&&lead.status!==newStatus){
        lead.status=newStatus;show('akquise');setStatus('sync','Speichere…');
        const {error}=await sb.from('leads').update({status:newStatus}).eq('id',id);
        setStatus(error?'offline':'online',error?'Fehler':'Live verbunden');
      }
    });
  });
}

    <div class="detail-head">

    </div>
    <div class="detail-body">

        <div class="dfield-label">📍 Standort</div>
        <div class="dfield-val ${l.loc?'':'empty'}">${esc(l.loc||'Nicht angegeben')}</div>
      </div>
      <div class="dfield">
        <div class="dfield-label">📞 Telefon</div>
        <div class="dfield-val ${l.phone?'':'empty'}">${l.phone?`<a href="tel:${esc(l.phone).replace(/\s/g,'')}">${esc(l.phone)}</a>`:'Noch zu recherchieren'}</div>
      </div>
      <div class="dfield">
        <div class="dfield-label">👤 Kontaktperson</div>
        <div class="dfield-val ${l.contact_person?'':'empty'}">${esc(l.contact_person||'Unbekannt')}</div>
      </div>
      <div class="dfield">
        <div class="dfield-label">🌐 Demo / Website</div>
        <div class="dfield-val ${l.demo_url?'':'empty'}">${l.demo_url?`<a href="${esc(l.demo_url)}" target="_blank" rel="noopener">${esc(l.demo_url)}</a>`:'Noch keine Demo gebaut'}</div>
      </div>
      <div class="dfield">
        <div class="dfield-label">📝 Notizen & Recherche</div>
        <div class="detail-notes">${esc(l.notes||'Keine Notizen hinterlegt.')}</div>
      </div>
      <a class="detail-map" href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}" target="_blank" rel="noopener">🗺 Auf Google Maps suchen</a>
      <div class="detail-actions">
        <button class="btn" onclick="editLead(${l.id},event)">✎ Bearbeiten</button>
        ${l.phone?`<a class="btn btn-gold" href="tel:${esc(l.phone).replace(/\s/g,'')}">📞 Anrufen</a>`:''}
      </div>
    </div>`;
  document.getElementById('detailBg').classList.add('show');
}
function closeDetail(){document.getElementById('detailBg').classList.remove('show');}
document.getElementById('detailBg').addEventListener('click',e=>{if(e.target.id==='detailBg')closeDetail();});
// MODAL
let modalStatus='recherchiert',editId=null;
function openModal(status){
  editId=null;modalStatus=status||'recherchiert';
  document.getElementById('modalTitle').textContent='Neuer Lead';
  document.getElementById('modalSave').textContent='Speichern';
  ['mName','mBranch','mLoc','mPhone','mContact','mDemo','mNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mStatus').value=modalStatus;
  document.getElementById('modalBg').classList.add('show');
  setTimeout(()=>document.getElementById('mName').focus(),50);
}
function editLead(id,e){
  if(e)e.stopPropagation();
  const l=leads.find(x=>x.id===id);if(!l)return;editId=id;
  closeDetail();
  document.getElementById('modalTitle').textContent='Lead bearbeiten';
  document.getElementById('modalSave').textContent='Aktualisieren';
  document.getElementById('mName').value=l.name||'';
  document.getElementById('mBranch').value=l.branch||'';
  document.getElementById('mLoc').value=l.loc||'';
  document.getElementById('mPhone').value=l.phone||'';
  document.getElementById('mContact').value=l.contact_person||'';
  document.getElementById('mDemo').value=l.demo_url||'';
  document.getElementById('mNotes').value=l.notes||'';
  document.getElementById('mStatus').value=l.status||'recherchiert';
  document.getElementById('modalBg').classList.add('show');
  setTimeout(()=>document.getElementById('mName').focus(),50);
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
async function saveLead(){
  const name=document.getElementById('mName').value.trim();
  if(!name){document.getElementById('mName').focus();return;}
  const payload={
    name,
    branch:document.getElementById('mBranch').value.trim()||null,
    loc:document.getElementById('mLoc').value.trim()||'Hamm',
    phone:document.getElementById('mPhone').value.trim()||null,
    contact_person:document.getElementById('mContact').value.trim()||null,
    demo_url:document.getElementById('mDemo').value.trim()||null,
    notes:document.getElementById('mNotes').value.trim()||null,
    status:document.getElementById('mStatus').value
  };
  closeModal();setStatus('sync','Speichere…');
  if(editId){
    const {error}=await sb.from('leads').update(payload).eq('id',editId);
    if(error){setStatus('offline','Fehler');return;}
    const idx=leads.findIndex(l=>l.id===editId);if(idx>-1)leads[idx]={...leads[idx],...payload};
  }else{
    const {data,error}=await sb.from('leads').insert(payload).select();
    if(error){setStatus('offline','Fehler');return;}
    leads.push(data[0]);
  }
  setStatus('online','Live verbunden');show('akquise');
}
async function delLead(id,e){
  if(e)e.stopPropagation();leads=leads.filter(l=>l.id!==id);show('akquise');setStatus('sync','Lösche…');
